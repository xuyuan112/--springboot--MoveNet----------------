# =====================================================================
# 康复训练平台开发/演示环境一键依赖：MySQL 8 + Redis 7 + MinIO + Nginx
# 使用：在 deploy 目录执行  docker compose up -d
# 后端首次启动会经 Flyway 自动建表（库由 JDBC createDatabaseIfNotExist 创建）
# =====================================================================
services:

  mysql:
    image: mysql:8.0.36
    container_name: rehab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rehab_platform
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - rehab-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: rehab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - rehab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: rehab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rehab-minio-data:/data

  # 前端静态托管 + 后端反代（生产形态）。
  # 使用前先在 frontend 目录执行 npm run build，dist 目录会以只读方式挂载。
  nginx:
    image: nginx:1.25-alpine
    container_name: rehab-nginx
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # 用户端独立静态站点。MoveNet 模型和 WASM 只存在于 frontend-app/dist，
  # 不能复用管理端 frontend/dist，否则 /models 和 /ort 会返回 404。
  nginx-app:
    image: nginx:1.25-alpine
    container_name: rehab-nginx-app
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "5174:80"
    volumes:
      - ../frontend-app/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx-app.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  rehab-mysql-data:
  rehab-redis-data:
  rehab-minio-data:
