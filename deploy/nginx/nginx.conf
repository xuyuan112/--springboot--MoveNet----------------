# =====================================================================
# Nginx 配置：前端 SPA 静态托管 + /api 反向代理到后端
# 后端服务需与本容器在同一 compose 网络，服务名为 backend 时可直接引用；
# 若后端跑在宿主机，请将 proxy_pass 改为 host.docker.internal:8080
# =====================================================================
server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Vue Router history 模式回退
        try_files $uri $uri/ /index.html;

        # 带 hash 的静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|mp4)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
    }

    # 后端接口（保留 /api/v1 前缀，与后端 context-path 一致）
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
